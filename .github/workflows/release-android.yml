name: Release Android APK + Windows ZIP + Web ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Map secrets to env first — `secrets` is not allowed in step `if` expressions.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pubspec version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "Tag version: $EXPECTED"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$PUBSPEC_VERSION" != "$EXPECTED" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) no coincide con el tag ($EXPECTED). Alinea version: X.Y.Z+N antes de tagear."
            exit 1
          fi

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Prepare firebase_options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_OPTIONS_BASE64:-}" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 -d > lib/firebase_options.dart
            echo "Usando FIREBASE_OPTIONS_BASE64 (FCM habilitado en este build)."
          else
            cp lib/firebase_options.stub.dart lib/firebase_options.dart
            echo "Sin secret Firebase: stub (inbox in-app; sin FCM)."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Write .env for build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder}"
            echo "GITHUB_OWNER=bastiansanchez24"
            echo "GITHUB_REPO=transworld_project_nexus"
            echo "UPDATE_CHANNEL=stable"
            echo "APP_PUBLIC_BASE_URL=https://intranet.transworld.cl"
          } > .env

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Stage APK asset
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          mkdir -p dist
          DEST="dist/android-nexus-${TAG}.apk"
          cp "$SRC" "$DEST"
          ls -lh "$DEST"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android-nexus-*.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pubspec version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "Tag version: $EXPECTED"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$PUBSPEC_VERSION" != "$EXPECTED" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) no coincide con el tag ($EXPECTED). Alinea version: X.Y.Z+N antes de tagear."
            exit 1
          fi

      - name: Prepare firebase_options
        shell: bash
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_OPTIONS_BASE64:-}" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 -d > lib/firebase_options.dart
          else
            cp lib/firebase_options.stub.dart lib/firebase_options.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Write .env for build
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder}"
            echo "GITHUB_OWNER=bastiansanchez24"
            echo "GITHUB_REPO=transworld_project_nexus"
            echo "UPDATE_CHANNEL=stable"
            echo "APP_PUBLIC_BASE_URL=https://intranet.transworld.cl"
          } > .env

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $src = "build/windows/x64/runner/Release"
          $destDir = "dist"
          $zipName = "windows-nexus-$tag.zip"
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          $zipPath = Join-Path $destDir $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zipPath
          Write-Host "Packaged $zipPath"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/windows-nexus-*.zip
          if-no-files-found: error
          retention-days: 7

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pubspec version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "Tag version: $EXPECTED"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$PUBSPEC_VERSION" != "$EXPECTED" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) no coincide con el tag ($EXPECTED). Alinea version: X.Y.Z+N antes de tagear."
            exit 1
          fi

      - name: Prepare firebase_options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_OPTIONS_BASE64:-}" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 -d > lib/firebase_options.dart
            echo "Usando FIREBASE_OPTIONS_BASE64 (FCM habilitado en este build)."
          else
            cp lib/firebase_options.stub.dart lib/firebase_options.dart
            echo "Sin secret Firebase: stub (inbox in-app; sin FCM)."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Write .env for build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder}"
            echo "GITHUB_OWNER=bastiansanchez24"
            echo "GITHUB_REPO=transworld_project_nexus"
            echo "UPDATE_CHANNEL=stable"
            echo "APP_PUBLIC_BASE_URL=https://intranet.transworld.cl"
          } > .env

      - name: Build Web (release)
        run: flutter build web --release

      - name: Package Web ZIP
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SRC="build/web"
          mkdir -p dist
          DEST="dist/web-nexus-${TAG}.zip"
          rm -f "$DEST"
          (cd "$SRC" && zip -r "$GITHUB_WORKSPACE/$DEST" .)
          ls -lh "$DEST"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: dist/web-nexus-*.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-zip
          path: release-assets

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print
          test -f "release-assets/android-nexus-${GITHUB_REF_NAME}.apk"
          test -f "release-assets/windows-nexus-${GITHUB_REF_NAME}.zip"
          test -f "release-assets/web-nexus-${GITHUB_REF_NAME}.zip"

      # Solo sube assets. No setea name/body/generate_release_notes
      # para no modificar el título ni la descripción de la release.
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/android-nexus-${{ github.ref_name }}.apk
            release-assets/windows-nexus-${{ github.ref_name }}.zip
            release-assets/web-nexus-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
