name: Release Android APK + Windows ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Map secrets to env first — `secrets` is not allowed in step `if` expressions.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pubspec version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "Tag version: $EXPECTED"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$PUBSPEC_VERSION" != "$EXPECTED" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) no coincide con el tag ($EXPECTED). Alinea version: X.Y.Z+N antes de tagear."
            exit 1
          fi

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Prepare firebase_options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_OPTIONS_BASE64:-}" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 -d > lib/firebase_options.dart
            echo "Usando FIREBASE_OPTIONS_BASE64 (FCM habilitado en este build)."
          else
            cp lib/firebase_options.stub.dart lib/firebase_options.dart
            echo "Sin secret Firebase: stub (inbox in-app; sin FCM)."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Write .env for build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder}"
            echo "GITHUB_OWNER=bastiansanchez24"
            echo "GITHUB_REPO=transworld_project_nexus"
            echo "UPDATE_CHANNEL=stable"
            echo "APP_PUBLIC_BASE_URL=https://intranet.transworld.cl"
          } > .env

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK asset
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          DEST="build/app/outputs/flutter-apk/android-NEXUS-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "ASSET_PATH=$DEST" >> "$GITHUB_ENV"
          echo "ASSET_NAME=android-NEXUS-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXUS ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ASSET_PATH }}
          body: |
            Actualización de Nexus `${{ github.ref_name }}`.

            Assets:
            - `android-NEXUS-${{ github.ref_name }}.apk`
            - `windows-NEXUS-${{ github.ref_name }}.zip` (subido por el job Windows)
            - `NexusSetup.exe` — instalador bootstrap (descarga la última versión)
            - `NexusBootstrap.zip` — scripts PS1/BAT del instalador bootstrap

            Para marcar la actualización como **obligatoria**, edita las notas
            de esta Release y agrega la línea:

            `[FORCE_UPDATE]`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare firebase_options
        shell: bash
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_OPTIONS_BASE64:-}" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 -d > lib/firebase_options.dart
          else
            cp lib/firebase_options.stub.dart lib/firebase_options.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Write .env for build
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder}"
            echo "GITHUB_OWNER=bastiansanchez24"
            echo "GITHUB_REPO=transworld_project_nexus"
            echo "UPDATE_CHANNEL=stable"
            echo "APP_PUBLIC_BASE_URL=https://intranet.transworld.cl"
          } > .env

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $src = "build/windows/x64/runner/Release"
          $destDir = "build/windows/dist"
          $zipName = "windows-NEXUS-$tag.zip"
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          $zipPath = Join-Path $destDir $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zipPath
          "ASSET_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package bootstrap installer scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destDir = "build/windows/dist"
          $bootstrapZip = Join-Path $destDir "NexusBootstrap.zip"
          if (Test-Path $bootstrapZip) { Remove-Item $bootstrapZip -Force }
          Compress-Archive -Path @(
            "scripts/install-nexus.ps1",
            "scripts/install-nexus.bat",
            "scripts/uninstall-nexus.ps1"
          ) -DestinationPath $bootstrapZip
          "BOOTSTRAP_PATH=$bootstrapZip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build NexusSetup.exe (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          $env:INNO_SETUP_COMPILER = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $env:INNO_SETUP_COMPILER)) {
            $env:INNO_SETUP_COMPILER = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          & "$env:GITHUB_WORKSPACE\scripts\build-installer.ps1"
          $setup = "build/windows/installer/NexusSetup.exe"
          if (-not (Test-Path $setup)) { throw "Falta $setup" }
          "SETUP_PATH=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.BOOTSTRAP_PATH }}
            ${{ env.SETUP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
