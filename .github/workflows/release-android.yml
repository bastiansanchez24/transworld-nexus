name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pubspec version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "Tag version: $EXPECTED"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$PUBSPEC_VERSION" != "$EXPECTED" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) no coincide con el tag ($EXPECTED). Alinea version: X.Y.Z+N antes de tagear."
            exit 1
          fi

      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Write .env for build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder}"
            echo "GITHUB_OWNER=bastiansanchez24"
            echo "GITHUB_REPO=transworld_project_nexus"
            echo "UPDATE_CHANNEL=stable"
            echo "APP_PUBLIC_BASE_URL=https://intranet.transworld.cl"
          } > .env

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK asset
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          DEST="build/app/outputs/flutter-apk/android-NEXUS-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "ASSET_PATH=$DEST" >> "$GITHUB_ENV"
          echo "ASSET_NAME=android-NEXUS-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXUS ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ASSET_PATH }}
          body: |
            Actualización de Nexus `${{ github.ref_name }}`.

            Asset: `android-NEXUS-${{ github.ref_name }}.apk`

            Para marcar la actualización como **obligatoria**, edita las notas
            de esta Release y agrega la línea:

            `[FORCE_UPDATE]`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
