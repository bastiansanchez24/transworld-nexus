# Host/CI runners are ~7GB RAM; -Xmx8G + MaxMetaspaceSize=4G OOMs the Gradle daemon.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Avoid Kotlin 2.3.x Windows crash: "Could not close incremental caches".
kotlin.incremental=false
