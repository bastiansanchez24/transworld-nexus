name: flutter_local_notifications_windows
description: >
  Dart-only stub of flutter_local_notifications_windows for Nexus.
  Avoids native ATL/coroutine build; Windows uses in-app inbox only.
version: 1.0.3
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^9.0.0
  meta: ^1.11.0
  timezone: ^0.10.0
  xml: ^6.5.0

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindows
